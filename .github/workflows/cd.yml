name: CD

# Two strictly separated triggers: manual Supabase DEV migrations versus gated Production release.
# workflow_dispatch must never enter a Production job; workflow_run must never enter DEV migrations.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan migration drift or apply to Supabase DEV with explicit approval
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      apply_confirmation:
        description: 'For apply only, type APPLY-DEV to acknowledge DEV database writes'
        type: string
        required: false
        default: ''
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Manual DEV and release-driven Production must not block each other.
  group: ${{ github.event_name == 'workflow_dispatch' && 'supabase-dev-migrations' || 'hbd-production-release' }}
  cancel-in-progress: false

jobs:
  supabase_production_plan:
    name: Validate Supabase production migration plan
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ENABLE_PRODUCTION_CD == 'true' &&
      vars.ENABLE_SUPABASE_PROD_PLAN == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted main release and isolated production target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || exit 1
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
          [[ "$SUPABASE_PROJECT_REF" != "daelpglayqvibpsbklwe" ]] || {
            echo "::error::Hosted Supabase DEV must never be used as the production migration target"; exit 1
          }
          version="$(node -p "require('./package.json').version")"
          git fetch --force --tags origin main
          test "$(git rev-list -n 1 "v$version")" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: "2.108.0"
      - name: Link exact target production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Inspect production migration ledger
        run: supabase migration list --linked
      - name: Dry-run canonical migrations (no production DB writes)
        run: supabase db push --linked --dry-run

  tencent_backend:
    name: Tencent backend deployment gate (runtime not selected)
    needs: [supabase_production_plan]
    if: >-
      github.event_name == 'workflow_run' &&
      vars.ENABLE_TENCENT_CD == 'true' &&
      vars.ENABLE_PRODUCTION_CD == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fail closed until Tencent host and rollout are accepted
        shell: bash
        run: |
          echo "::error::Tencent SCF versus CVM/container, region, ingress and rollback are not yet approved; no backend deploy adapter exists"
          exit 1

  deploy:
    name: Approved Vercel production release
    needs: [supabase_production_plan, tencent_backend]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ENABLE_PRODUCTION_CD == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release provenance and Vercel target
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_ORG_ID" = "team_tUI2OLsX7oc0ppLmXJUz4M0p"
          test "$VERCEL_PROJECT_ID" = "prj_pKN4O9pgMbsLHdTcLdzVXDX1Zmla"
          test -n "$VERCEL_TOKEN"
          version="$(node -p "require('./package.json').version")"
          git fetch --force --tags origin main
          test "$(git rev-list -n 1 "v$version")" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA" || {
            echo "::error::Main advanced since release; refuse stale production deploy"
            exit 1
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate frontend before deployment
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @happy-birthday/web lint
          pnpm --filter @happy-birthday/web test
          pnpm --filter @happy-birthday/web build
      - name: Install fixed Vercel CLI
        run: npm install -g vercel@65.1.0
      - name: Pull production environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production
      - name: Build Vercel artifacts
        working-directory: apps/web
        run: vercel build --prod
      - name: Stage production without domain assignment
        id: stage
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain)"
          [[ "$url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]] || exit 1
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Promote approved build
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        working-directory: apps/web
        run: vercel promote "$DEPLOYMENT_URL"

  supabase_dev_migrations:
    name: DEV migrations (${{ inputs.operation }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-dev
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ALLOW_DEV_APPLY: ${{ vars.ENABLE_SUPABASE_DEV_APPLY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate target and requested operation
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Missing Supabase DEV environment secrets"; exit 1; }
          # DEV identity verified read-only in Supabase on 2026-10-25.
          # Never point this workflow at the unrelated 'Day' project or future PROD.
          if [[ "$SUPABASE_PROJECT_REF" != "daelpglayqvibpsbklwe" ]]; then
            echo "::error::Wrong DEV target; refusing to link to an unverified Supabase project"; exit 1
          fi
          if [[ "$REQUESTED_OPERATION" != "plan" && "$REQUESTED_OPERATION" != "apply" ]]; then
            echo "::error::Unsupported DEV operation"; exit 1
          fi
          if [[ "$REQUESTED_OPERATION" == "apply" ]]; then
            if [[ "$ALLOW_DEV_APPLY" != "true" || "$APPLY_CONFIRMATION" != "APPLY-DEV" ]]; then
              echo "::error::DEV apply requires ENABLE_SUPABASE_DEV_APPLY=true and APPLY-DEV confirmation"; exit 1
            fi
          fi
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: "2.108.0"
      - name: Link explicitly selected DEV project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Inspect migration history
        run: supabase migration list --linked
      - name: Plan pending SQL without changes
        run: supabase db push --linked --dry-run
      - name: Apply DEV SQL migrations
        if: inputs.operation == 'apply'
        run: supabase db push --linked
      - name: Verify remote migration history
        if: inputs.operation == 'apply'
        run: supabase migration list --linked
