name: Prepare Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Determine version from Conventional Commits
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          last="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [[ -n "$last" ]]; then
            commits="$(git log "${last}..HEAD" --pretty=format:'%s%n%b')"
          else
            commits="$(git log --pretty=format:'%s%n%b')"
          fi
          read -r major minor patch <<< "${current//./ }"
          if printf '%s\n' "$commits" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:'; then
            next="$((major + 1)).0.0"
          elif printf '%s\n' "$commits" | grep -qE '^feat(\([^)]*\))?:'; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          printf 'version=%s\nbranch=release/v%s\n' "$next" "$next" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            existing="$(gh pr list --state open --base main --head "$BRANCH" --json number --jq '.[0].number')"
            if [[ -z "$existing" ]]; then
              echo "::error::$BRANCH exists without an open release PR; review it manually"
              exit 1
            fi
            echo "::notice::Release PR #$existing already open; preserving it"
            exit 0
          fi
          git switch -c "$BRANCH"
          npm version "$VERSION" --no-git-tag-version --package-lock=false --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh label create release --color 0075ca --description "Automated release PR" --force
          gh pr create --base main --head "$BRANCH" --title "chore(release): v$VERSION" --label release \
            --body "Automated version proposal for **v$VERSION**. Review validation before merge. Production CD is opt-in and requires environment approval."
          # Token-created PRs don't fire CI: dispatch validations explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
