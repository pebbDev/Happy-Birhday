name: Supabase DEV Migration Delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan migration drift or apply to hosted DEV with explicit approval
        type: choice
        required: true
        default: plan
        options: [plan, apply]
permissions:
  contents: read
concurrency:
  group: supabase-dev-migrations
  cancel-in-progress: false
jobs:
  migrations:
    name: DEV migrations (${{ inputs.operation }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-dev
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ALLOW_DEV_APPLY: ${{ vars.ENABLE_SUPABASE_DEV_APPLY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate target and requested operation
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Missing Supabase DEV environment secrets"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Invalid Supabase DEV project ref"; exit 1; }
          if [[ "$REQUESTED_OPERATION" == "apply" && "$ALLOW_DEV_APPLY" != "true" ]]; then
            echo "::error::DEV apply requires ENABLE_SUPABASE_DEV_APPLY=true"; exit 1
          fi
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: "2.108.0"
      - name: Link explicitly selected DEV project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Inspect migration history
        run: supabase migration list --linked
      - name: Plan pending SQL without changes
        run: supabase db push --linked --dry-run
      - name: Apply DEV SQL migrations
        if: inputs.operation == 'apply'
        run: supabase db push --linked
      - name: Verify remote migration history
        if: inputs.operation == 'apply'
        run: supabase migration list --linked
