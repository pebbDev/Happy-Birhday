name: Create Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: create-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create tag and GitHub Release
    if: >-
      startsWith(github.event.head_commit.message, 'chore(release):') ||
      contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release version changed on main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          previous="$(git show 'HEAD^:package.json' | node -e "let a=''; process.stdin.on('data',d=>a+=d); process.stdin.on('end',()=>console.log(JSON.parse(a).version || ''))")"
          [[ "$version" != "$previous" ]] || { echo "::error::No release version change"; exit 1; }
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Tag release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
