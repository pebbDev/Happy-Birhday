name: CI

# Unified API, database, web and GitHub workflow validation.
# Run all jobs on PRs to main; avoid path filters on required checks.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install from frozen workspace lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run prisma:generate
      - name: Validate Prisma schema
        run: pnpm run prisma:validate
      - name: Check API types and unit tests
        run: pnpm run check
      - name: Build deployable Node 24 Fastify and smoke without DB secrets
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @happy-birthday/api build
          node .github/scripts/smoke-api-bundle.mjs apps/api
      - name: Verify deployable artifact with production-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @happy-birthday/api deploy --prod "$RUNNER_TEMP/hbd-api"
          mkdir -p "$RUNNER_TEMP/hbd-api/dist"
          cp -a apps/api/dist/. "$RUNNER_TEMP/hbd-api/dist/"
          node .github/scripts/smoke-api-bundle.mjs "$RUNNER_TEMP/hbd-api"

  database:
    name: Database validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate temporary PostgreSQL test password
        shell: bash
        run: |
          echo "HBD_PG_TEST_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p hbd-ci-db -f infra/docker/compose.test.yml up -d --wait postgres

      - name: Apply canonical SQL migrations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if (( ${#migrations[@]} == 0 )); then
            echo "::error::No canonical SQL migrations found"
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            filename="${migration##*/}"
            echo "[MIGRATION] $filename"
            docker compose -p hbd-ci-db -f infra/docker/compose.test.yml exec -T postgres \
              psql -U postgres -d hbd_test -X -q -v ON_ERROR_STOP=1 -1 \
              -f "/workspace/migrations/$filename"
          done
          echo "Applied ${#migrations[@]} canonical migrations"

      - name: Run SQL regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(supabase/tests/database/*.sql)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No SQL regression tests found"
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            filename="${test_file##*/}"
            echo "[SQL TEST] $filename"
            docker compose -p hbd-ci-db -f infra/docker/compose.test.yml exec -T postgres \
              psql -U postgres -d hbd_test -X -q -v ON_ERROR_STOP=1 \
              -f "/workspace/tests/$filename"
          done
          echo "Passed ${#tests[@]} SQL regression files"

      - name: Remove isolated test database
        if: always()
        shell: bash
        run: |
          docker compose -p hbd-ci-db -f infra/docker/compose.test.yml down --volumes --remove-orphans

  web:
    name: Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned workspace lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck Vue
        run: pnpm --filter @happy-birthday/web typecheck
      - name: Lint Vue
        run: pnpm --filter @happy-birthday/web lint
      - name: Test Vue
        run: pnpm --filter @happy-birthday/web test
      - name: Build and verify SSG + CSR output
        run: pnpm --filter @happy-birthday/web build

  workflow_lint:
    name: GitHub workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Validate GitHub Actions YAML and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
