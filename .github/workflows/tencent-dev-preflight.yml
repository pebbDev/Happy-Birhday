name: Tencent DEV API Artifact Preflight
# Does not contact Tencent Cloud, create cloud resources, or deploy any API.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tencent-dev-artifact-preflight
  cancel-in-progress: false
jobs:
  build:
    name: Build & smoke Node 24 Tencent candidate bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build Fastify for Node 24
        run: |
          pnpm run prisma:generate
          pnpm --filter @happy-birthday/api typecheck
          pnpm --filter @happy-birthday/api build
      - name: Assemble production-only API bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @happy-birthday/api deploy --prod "$RUNNER_TEMP/hbd-api"
          mkdir -p "$RUNNER_TEMP/hbd-api/dist"
          cp -a apps/api/dist/. "$RUNNER_TEMP/hbd-api/dist/"
          test -f "$RUNNER_TEMP/hbd-api/dist/main.js"
          test -f "$RUNNER_TEMP/hbd-api/dist/generated/prisma/client.js"
      - name: Smoke compiled bundle without a DB secret
        shell: bash
        run: node .github/scripts/smoke-api-bundle.mjs "$RUNNER_TEMP/hbd-api"
      - name: Produce immutable-intent artifact with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/hbd-api" -czf "$RUNNER_TEMP/hbd-api.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum hbd-api.tar.gz > hbd-api.tar.gz.sha256
          cat hbd-api.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tencent-api-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hbd-api.tar.gz
            ${{ runner.temp }}/hbd-api.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
